name: lab15-mongodb
services:
  mongo:
    image: mongo:8.0
    volumes: [data:/data/db]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ping:1}).ok']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    image: ${LAB_IMAGE:-gouravram77/lab15-mongodb:1.0}
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017
      RATE_LIMIT: '30'
    ports: ['127.0.0.1:3015:8000']
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: ['./evidence:/lab/evidence']
volumes:
  data:
