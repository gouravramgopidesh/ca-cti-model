apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongo
  namespace: lab13-mongodb
spec:
  serviceName: mongo-headless-svc
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: mongo-lab13
  template:
    metadata:
      labels:
        app: mongo-lab13
    spec:
      initContainers:
        - name: keyfile-init
          image: mongo:8.0
          command: ["bash", "-ec", "cp /secret/keyfile /key/keyfile; chown mongodb:mongodb /key/keyfile; chmod 400 /key/keyfile"]
          volumeMounts:
            - {name: secret-key, mountPath: /secret, readOnly: true}
            - {name: runtime-key, mountPath: /key}
      containers:
        - name: mongo
          image: mongo:8.0
          args: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--keyFile", "/key/keyfile", "--wiredTigerCacheSizeGB", "0.25"]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: labadmin
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: mongo-credentials, key: password}
          ports:
            - {name: mongodb, containerPort: 27017}
          readinessProbe:
            tcpSocket: {port: 27017}
            periodSeconds: 5
          resources:
            requests: {memory: 256Mi, cpu: 100m}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: runtime-key, mountPath: /key, readOnly: true}
      volumes:
        - name: secret-key
          secret: {secretName: mongo-credentials}
        - name: runtime-key
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
