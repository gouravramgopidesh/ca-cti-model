name: lab7-mongodb
services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGODB_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
      - ./database-dump/lab7.archive.gz:/seed/lab7.archive.gz:ro
      - ./labs/01-restore.sh:/docker-entrypoint-initdb.d/01-restore.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--host", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017
      DB_NAME: lab7-mongodb
      WORKING_SET_SIZE: ${WORKING_SET_SIZE:-100000}
      REPORT_SYNC_INTERVAL_MS: ${REPORT_SYNC_INTERVAL_MS:-600000}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - ./evidence:/app/evidence
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mongo_data:
